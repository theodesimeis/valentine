<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 Marine ?</title>

  <style>
    :root { --bg:#fff5f8; --card:#ffffff; --text:#2a2a2a; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% 30%, #ffe3ec 0%, var(--bg) 55%, #fff 100%);
      color:var(--text);
      overflow:hidden;
    }
    .card{
      width:min(560px, 92vw);
      background:var(--card);
      border-radius:24px;
      padding:24px;
      box-shadow: 0 18px 60px rgba(0,0,0,.10);
      text-align:center;
      position:relative;
      overflow:hidden;
      z-index:2;
    }
    .img{
      width:100%;
      aspect-ratio: 16/10;
      border-radius:18px;
      object-fit:cover;
      border: 1px solid rgba(0,0,0,.06);
      background:#ffe9f0;
    }
    h1{ margin:16px 0 6px; font-size:28px; }
    p{ margin:0 0 18px; opacity:.85; }
    .buttons{
      display:flex; gap:14px; justify-content:center; align-items:center;
      margin-top:10px;
      position:relative;
      height:60px;
    }
    button{
      border:0; cursor:pointer; padding:14px 22px; border-radius:14px;
      font-size:18px; font-weight:800;
      transition: transform .08s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #yes{
      background:#ff2d6f; color:white;
      box-shadow: 0 10px 20px rgba(255,45,111,.25);
      font-size:22px;
      padding:16px 28px;
    }
    #yes:active{ transform: scale(.98); }
    #no{
      background:#f1f1f1; color:#444;
      position:relative;
      font-size:14px;
      padding:10px 14px;
      opacity:.9;
    }
    #message{
      margin-top:16px;
      font-weight:900;
      font-size:20px;
      display:none;
    }
    .hint{
      font-size:12px;
      opacity:.65;
      margin-top:10px;
    }

    /* Coeurs plein écran */
    .heart-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
      overflow:hidden;
    }
    .heart{
      position:absolute;
      font-size:24px;
      will-change: transform, opacity;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
    }
    @keyframes floatUp{
      0%   { transform: translateY(20px) scale(0.9) rotate(0deg); opacity:0; }
      10%  { opacity:1; }
      100% { transform: translateY(-120vh) scale(1.3) rotate(25deg); opacity:0; }
    }

    /* Petit glow quand "OUI" est cliqué */
    .glow{
      animation: glow 700ms ease-out;
    }
    @keyframes glow{
      0% { box-shadow: 0 18px 60px rgba(0,0,0,.10); }
      40% { box-shadow: 0 22px 90px rgba(255,45,111,.25); }
      100% { box-shadow: 0 18px 60px rgba(0,0,0,.10); }
    }
  </style>
</head>

<body>
  <div class="heart-layer" id="heartLayer"></div>

  <div class="card" id="card">
    <!-- Remplacez le src par votre image -->
    <img class="img" id="cuteImg"
         src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80"
         alt="Image mignonne" />

    <h1>Marine, la plus belle femme du monde, veux-tu être ma Valentine ? 💘</h1>
    <p>(Clique pas sur non stp 😏)</p>

    <div class="buttons" id="btnZone">
      <button id="yes">OUI !!!</button>
      <button id="no">non</button>
    </div>

    <div id="message">Hmmm… quel cadeau j’ai bien pu te faire 😏</div>
    <div class="hint" id="hint" style="display:none;">(Indice : c’est toi 😇)</div>
  </div>

  <!-- Musique: ajoutez votre fichier MP3 dans le repo et gardez ce nom -->
  <audio id="loveSong" preload="auto">
    <source src="love-to-love.mp3" type="audio/mpeg">
  </audio>

  <script>
    const card = document.getElementById('card');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const msg = document.getElementById('message');
    const hint = document.getElementById('hint');
    const btnZone = document.getElementById('btnZone');

    const heartLayer = document.getElementById('heartLayer');
    const song = document.getElementById('loveSong');

    // --- Bouton NON qui fuit ---
    let absoluteMode = false;

    function moveNoButton(e){
      const cardRect = card.getBoundingClientRect();
      const btnRect  = noBtn.getBoundingClientRect();

      if(!absoluteMode){
        absoluteMode = true;
        const currentLeft = btnRect.left - cardRect.left;
        const currentTop  = btnRect.top  - cardRect.top;
        noBtn.style.position = 'absolute';
        noBtn.style.left = `${currentLeft}px`;
        noBtn.style.top  = `${currentTop}px`;
      }

      const mx = e.clientX - cardRect.left;
      const my = e.clientY - cardRect.top;

      const bx = parseFloat(noBtn.style.left) + noBtn.offsetWidth / 2;
      const by = parseFloat(noBtn.style.top)  + noBtn.offsetHeight / 2;

      const dx = bx - mx;
      const dy = by - my;
      const dist = Math.hypot(dx, dy);

      const trigger = 120;
      if(dist < trigger){
        const push = (trigger - dist) * 2.1;
        const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.7;

        let newLeft = parseFloat(noBtn.style.left) + Math.cos(angle) * push;
        let newTop  = parseFloat(noBtn.style.top)  + Math.sin(angle) * push;

        const padding = 12;
        const minL = padding;
        const minT = padding;
        const maxL = cardRect.width  - noBtn.offsetWidth  - padding;
        const maxT = cardRect.height - noBtn.offsetHeight - padding;

        newLeft = Math.max(minL, Math.min(maxL, newLeft));
        newTop  = Math.max(minT, Math.min(maxT, newTop));

        noBtn.style.left = `${newLeft}px`;
        noBtn.style.top  = `${newTop}px`;
      }
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    card.addEventListener('mousemove', moveNoButton);
    noBtn.addEventListener('click', (e)=> e.preventDefault()); // au cas où

    // --- Coeurs plein écran ---
    function spawnHeartsBurst(durationMs = 2600, ratePerSec = 55){
      const start = performance.now();
      const interval = 1000 / ratePerSec;

      const timer = setInterval(() => {
        const now = performance.now();
        if(now - start > durationMs){
          clearInterval(timer);
          return;
        }
        createHeart();
      }, interval);
    }

    function createHeart(){
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = Math.random() < 0.2 ? '💖' : (Math.random() < 0.4 ? '💘' : '❤️');

      const x = Math.random() * 100; // vw
      const size = 18 + Math.random() * 26; // px
      const duration = 2200 + Math.random() * 2200; // ms

      heart.style.left = `${x}vw`;
      heart.style.bottom = `-40px`;
      heart.style.fontSize = `${size}px`;
      heart.style.animationDuration = `${duration}ms`;
      heart.style.opacity = '0.95';

      heartLayer.appendChild(heart);
      setTimeout(() => heart.remove(), duration + 200);
    }

    // --- Click OUI ---
    yesBtn.addEventListener('click', async () => {
      msg.style.display = 'block';
      hint.style.display = 'block';
      yesBtn.textContent = 'OUIIIII 😍';
      noBtn.style.display = 'none';

      card.classList.remove('glow');
      void card.offsetWidth;
      card.classList.add('glow');

      // Déclenche les coeurs
      spawnHeartsBurst(3200, 70);

      // Musique (démarre seulement au clic, sinon le navigateur bloque)
      try{
        song.volume = 0.75;
        await song.play();
      }catch(e){
        // Si bloqué (rare après un clic), elle verra quand même les coeurs
        console.log('Audio non démarré:', e);
      }
    });
  </script>
</body>
</html>
