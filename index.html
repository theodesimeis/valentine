<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 Valentine ?</title>
  <style>
    :root { --bg:#fff5f8; --card:#ffffff; --text:#2a2a2a; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% 30%, #ffe3ec 0%, var(--bg) 55%, #fff 100%);
      color:var(--text);
    }
    .card{
      width:min(520px, 92vw);
      background:var(--card);
      border-radius:24px;
      padding:24px;
      box-shadow: 0 18px 60px rgba(0,0,0,.10);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .img{
      width:100%;
      aspect-ratio: 16/10;
      border-radius:18px;
      object-fit:cover;
      border: 1px solid rgba(0,0,0,.06);
      background:#ffe9f0;
    }
    h1{ margin:16px 0 6px; font-size:28px; }
    p{ margin:0 0 18px; opacity:.8; }
    .buttons{
      display:flex; gap:14px; justify-content:center; align-items:center;
      margin-top:10px;
    }
    button{
      border:0; cursor:pointer; padding:14px 22px; border-radius:14px;
      font-size:18px; font-weight:700;
      transition: transform .08s ease;
      user-select:none;
    }
    #yes{
      background:#ff2d6f; color:white;
      box-shadow: 0 10px 20px rgba(255,45,111,.25);
      font-size:22px;
    }
    #yes:active{ transform: scale(.98); }
    #no{
      background:#f1f1f1; color:#444;
      position:relative; /* position initiale dans le flux */
      font-size:14px;
      padding:10px 14px;
      opacity:.9;
    }
    #message{
      margin-top:16px;
      font-weight:700;
      font-size:20px;
      display:none;
    }
    .hearts{
      position:absolute; inset:-40px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,45,111,.12) 0 18%, transparent 19%),
        radial-gradient(circle at 80% 30%, rgba(255,45,111,.10) 0 16%, transparent 17%),
        radial-gradient(circle at 30% 80%, rgba(255,45,111,.10) 0 14%, transparent 15%);
      filter: blur(0px);
      pointer-events:none;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="hearts"></div>

    <!-- Remplace le src par TON image (voir plus bas) -->
    <img class="img" id="cuteImg" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80" alt="Image mignonne" />

    <h1>Veux-tu être ma Valentine ? 💘</h1>
    <p>(Choisis bien 😇)</p>

    <div class="buttons">
      <button id="yes">OUI !!!</button>
      <button id="no">non</button>
    </div>

    <div id="message">Yesss 😍 Rendez-vous pour notre date 💐</div>
  </div>

  <script>
    const card = document.getElementById('card');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const msg = document.getElementById('message');

    // Place le bouton "non" en absolute quand on commence à le faire bouger
    let absoluteMode = false;

    function moveNoButton(e){
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // Passage en position:absolute (pour pouvoir le déplacer librement)
      if(!absoluteMode){
        absoluteMode = true;
        const currentLeft = btnRect.left - cardRect.left;
        const currentTop  = btnRect.top  - cardRect.top;
        noBtn.style.position = 'absolute';
        noBtn.style.left = `${currentLeft}px`;
        noBtn.style.top  = `${currentTop}px`;
      }

      // Position souris relative à la card
      const mx = e.clientX - cardRect.left;
      const my = e.clientY - cardRect.top;

      // Centre du bouton
      const bx = parseFloat(noBtn.style.left) + noBtn.offsetWidth / 2;
      const by = parseFloat(noBtn.style.top)  + noBtn.offsetHeight / 2;

      // Si la souris s'approche, on repousse le bouton
      const dx = bx - mx;
      const dy = by - my;
      const dist = Math.hypot(dx, dy);

      const trigger = 110; // distance de déclenchement
      if(dist < trigger){
        // Direction opposée à la souris + un peu d'aléatoire
        const push = (trigger - dist) * 1.8;
        const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.5;

        let newLeft = parseFloat(noBtn.style.left) + Math.cos(angle) * push;
        let newTop  = parseFloat(noBtn.style.top)  + Math.sin(angle) * push;

        // Clamp pour rester dans la card
        const padding = 12;
        const minL = padding;
        const minT = padding;
        const maxL = cardRect.width - noBtn.offsetWidth - padding;
        const maxT = cardRect.height - noBtn.offsetHeight - padding;

        newLeft = Math.max(minL, Math.min(maxL, newLeft));
        newTop  = Math.max(minT, Math.min(maxT, newTop));

        noBtn.style.left = `${newLeft}px`;
        noBtn.style.top  = `${newTop}px`;
      }
    }

    // Déclenchement au survol + au mouvement dans la card
    noBtn.addEventListener('mouseenter', moveNoButton);
    card.addEventListener('mousemove', moveNoButton);

    yesBtn.addEventListener('click', () => {
      msg.style.display = 'block';
      yesBtn.textContent = 'OUIIIII 😍';
      noBtn.style.display = 'none';
      // Petit bonus: confettis minimalistes (emoji)
      for(let i=0;i<18;i++){
        const s = document.createElement('div');
        s.textContent = ['💘','💖','✨','🌹'][Math.floor(Math.random()*4)];
        s.style.position='absolute';
        s.style.left = (20 + Math.random()*60) + '%';
        s.style.top  = (-10 + Math.random()*20) + '%';
        s.style.fontSize = (18 + Math.random()*18) + 'px';
        s.style.transform = `translateY(0)`;
        s.style.transition = `transform ${700+Math.random()*700}ms ease, opacity 1200ms ease`;
        card.appendChild(s);
        requestAnimationFrame(()=> {
          s.style.transform = `translateY(${260+Math.random()*260}px)`;
          s.style.opacity = '0';
        });
        setTimeout(()=> s.remove(), 1400);
      }
    });

    // Empêche le "non" via clavier (au cas où)
    noBtn.addEventListener('click', (e)=> e.preventDefault());
  </script>
</body>
</html>
