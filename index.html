<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 Marine ?</title>

  <style>
    :root { --bg:#fff5f8; --card:#ffffff; --text:#2a2a2a; }
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% 30%, #ffe3ec 0%, var(--bg) 55%, #fff 100%);
      color:var(--text);
      overflow:hidden;
    }
    .card{
      width:min(560px, 92vw);
      background:var(--card);
      border-radius:24px;
      padding:24px;
      box-shadow: 0 18px 60px rgba(0,0,0,.10);
      text-align:center;
      position:relative;
      overflow:hidden;
      z-index:2;
    }
    .img{
      width:100%;
      aspect-ratio: 16/10;
      border-radius:18px;
      object-fit:cover;
      border: 1px solid rgba(0,0,0,.06);
      background:#ffe9f0;
    }
    h1{ margin:16px 0 6px; font-size:28px; }
    p{ margin:0 0 18px; opacity:.85; }
    .buttons{
      display:flex; gap:14px; justify-content:center; align-items:center;
      margin-top:10px;
      position:relative;
      height:70px;
    }
    button{
      border:0; cursor:pointer; padding:14px 22px; border-radius:14px;
      font-size:18px; font-weight:800;
      user-select:none;
    }
    #yes{
      background:#ff2d6f; color:white;
      box-shadow: 0 10px 20px rgba(255,45,111,.25);
      font-size:22px;
      padding:16px 28px;
    }
    #no{
      background:#f1f1f1; color:#444;
      position:absolute;
      font-size:14px;
      padding:10px 14px;
      left:60%;
      top:15px;
    }
    #message{
      margin-top:16px;
      font-weight:900;
      font-size:20px;
      display:none;
    }

    /* coeurs */
    .heart{
      position:fixed;
      font-size:24px;
      animation: floatUp linear forwards;
      pointer-events:none;
      z-index:1;
    }
    @keyframes floatUp{
      0% { transform: translateY(20px); opacity:0; }
      10% { opacity:1; }
      100% { transform: translateY(-120vh); opacity:0; }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <img class="img"
         src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80"
         alt="Image mignonne" />

    <h1>Marine, la plus belle femme du monde, veux-tu être ma Valentine ? 💘</h1>
    <p>(Clique pas sur non stp 😏)</p>

    <div class="buttons" id="btnZone">
      <button id="yes">OUI !!!</button>
      <button id="no">non</button>
    </div>

    <div id="message">Hmmm… quel cadeau j’ai bien pu te faire 😏</div>
  </div>

  <audio id="loveSong">
    <source src="love-to-love.mp3" type="audio/mpeg">
  </audio>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const message = document.getElementById('message');
    const song = document.getElementById('loveSong');

    // NON qui fuit
    document.addEventListener('mousemove', e => {
      const rect = noBtn.getBoundingClientRect();
      const distance = Math.hypot(
        e.clientX - rect.left,
        e.clientY - rect.top
      );

      if(distance < 120){
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
      }
    });

    // coeurs
    function spawnHearts(){
      for(let i=0;i<40;i++){
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerText = "❤️";
        heart.style.left = Math.random()*100 + "vw";
        heart.style.bottom = "-20px";
        heart.style.animationDuration = (2 + Math.random()*2) + "s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),4000);
      }
    }

    // click oui
    yesBtn.addEventListener('click', () => {
      message.style.display = 'block';
      noBtn.style.display = 'none';
      spawnHearts();
      song.play();
    });
  </script>

</body>
</html>
